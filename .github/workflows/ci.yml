name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Kubuntu target: the same base the .deb is built on.
  ubuntu:
    name: Ubuntu 26.04
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates git build-essential pkg-config libgtk-4-dev libgtk4-layer-shell-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked

  # Arch target: rolling, newest GTK and Rust from the distro.
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 gtk4-layer-shell
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --release --locked
